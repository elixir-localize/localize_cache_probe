# nginx in front of the reference origin, which runs on the host.
#
# `proxy_cache` with its defaults: nginx honours the `vary` of a stored
# response, and does not store a response that sets a cookie. The
# `X-Cache-Status` header reports what the cache did with each request.

events {}

http {
    proxy_cache_path /var/cache/nginx/reference keys_zone=reference:10m;

    server {
        listen 80;

        location / {
            proxy_pass http://host.docker.internal:4010;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;

            proxy_cache reference;
            proxy_cache_key $scheme$proxy_host$request_uri;

            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
